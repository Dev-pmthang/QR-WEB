<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tạo QR Code đẹp mắt với nhiều hình dạng sáng tạo: trái tim, ngôi sao, kim cương,...">
    <title>Tạo QR Code - QR Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #050514; --card-bg: rgba(20,20,50,0.6);
            --glass-border: rgba(255,255,255,0.07); --text: #eef2ff;
            --text-sec: rgba(200,210,240,0.6); --text-muted: rgba(150,160,200,0.4);
            --accent: #818cf8; --accent-b: #a78bfa; --radius: 16px;
        }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            font-family: 'Outfit', sans-serif; background: var(--bg);
            color: var(--text); min-height: 100vh; padding: 24px 16px 48px;
        }
        .bg-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .bg-glow::before {
            content: ''; position: absolute; width: 600px; height: 600px;
            top: -200px; right: -200px; border-radius: 50%;
            background: radial-gradient(circle, rgba(99,102,241,0.12), transparent 70%); filter: blur(60px);
        }
        .bg-glow::after {
            content: ''; position: absolute; width: 500px; height: 500px;
            bottom: -200px; left: -200px; border-radius: 50%;
            background: radial-gradient(circle, rgba(168,85,247,0.08), transparent 70%); filter: blur(60px);
        }
        .container { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 32px; animation: fadeIn 0.6s ease-out; }
        .header h1 {
            font-size: 2rem; font-weight: 900;
            background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 6px;
        }
        .header p { color: var(--text-muted); font-size: 0.88rem; }
        .main-grid { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
        .card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: var(--radius); padding: 24px 20px; backdrop-filter: blur(20px);
            animation: slideUp 0.5s ease-out both;
        }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card-title {
            font-size: 0.9rem; font-weight: 700; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .card-title svg { color: var(--accent); flex-shrink: 0; }
        .form-group { margin-bottom: 18px; }
        .form-label {
            display: block; font-size: 0.7rem; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 6px;
        }
        input[type="url"] {
            width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border); border-radius: 12px;
            color: var(--text); font-family: 'Outfit', sans-serif; font-size: 0.9rem;
            outline: none; transition: all 0.3s;
        }
        input:focus { border-color: rgba(129,140,248,0.4); box-shadow: 0 0 0 3px rgba(129,140,248,0.08); }
        input::placeholder { color: var(--text-muted); }
        .separator { height: 1px; background: var(--glass-border); margin: 18px 0; }

        /* Shape Grid */
        .shape-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
        }
        @media (max-width: 480px) { .shape-grid { grid-template-columns: repeat(4, 1fr); } }
        .shape-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 10px 4px; background: rgba(0,0,0,0.2);
            border: 2px solid transparent; border-radius: 10px;
            cursor: pointer; transition: all 0.25s; text-align: center;
        }
        .shape-item:hover { background: rgba(129,140,248,0.08); border-color: rgba(129,140,248,0.15); }
        .shape-item.active {
            background: rgba(129,140,248,0.12); border-color: var(--accent);
            box-shadow: 0 0 10px rgba(129,140,248,0.15);
        }
        .shape-item canvas { width: 32px; height: 32px; }
        .shape-item .sname { font-size: 0.6rem; font-weight: 500; color: var(--text-sec); line-height: 1.2; }

        /* Color Grid */
        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .color-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 8px 4px; background: rgba(0,0,0,0.2);
            border: 2px solid transparent; border-radius: 10px;
            cursor: pointer; transition: all 0.25s;
        }
        .color-item:hover { background: rgba(129,140,248,0.08); border-color: rgba(129,140,248,0.15); }
        .color-item.active { background: rgba(129,140,248,0.12); border-color: var(--accent); }
        .color-swatch {
            width: 28px; height: 28px; border-radius: 50%;
            border: 2px solid transparent;
        }
        .color-item.active .color-swatch { border-color: white; box-shadow: 0 0 6px rgba(255,255,255,0.3); }
        .color-item .sname { font-size: 0.6rem; font-weight: 500; color: var(--text-sec); }

        /* Corner Grid */
        .corner-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .corner-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 10px 4px; background: rgba(0,0,0,0.2);
            border: 2px solid transparent; border-radius: 10px;
            cursor: pointer; transition: all 0.25s;
        }
        .corner-item:hover { background: rgba(129,140,248,0.08); border-color: rgba(129,140,248,0.15); }
        .corner-item.active { background: rgba(129,140,248,0.12); border-color: var(--accent); }
        .corner-item canvas { width: 30px; height: 30px; }
        .corner-item .sname { font-size: 0.6rem; font-weight: 500; color: var(--text-sec); }

        /* Bg Grid */
        .bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .bg-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 8px 4px; background: rgba(0,0,0,0.2);
            border: 2px solid transparent; border-radius: 10px;
            cursor: pointer; transition: all 0.25s;
        }
        .bg-item:hover { background: rgba(129,140,248,0.08); border-color: rgba(129,140,248,0.15); }
        .bg-item.active { background: rgba(129,140,248,0.12); border-color: var(--accent); }
        .bg-item .sname { font-size: 0.6rem; font-weight: 500; color: var(--text-sec); }

        /* Button */
        .btn-gen {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #818cf8, #a78bfa);
            color: var(--bg); border: none; border-radius: 14px;
            font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 6px 24px rgba(129,140,248,0.25);
        }
        .btn-gen:hover { transform: translateY(-2px); box-shadow: 0 10px 36px rgba(129,140,248,0.4); }

        /* Preview */
        .preview-card { text-align: center; position: sticky; top: 24px; }
        .qr-wrap {
            background: white; border-radius: 18px; padding: 16px;
            display: inline-block; margin: 12px 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .qr-wrap.checker {
            background: repeating-conic-gradient(#e0e0e0 0% 25%, #fff 0% 50%) 50%/16px 16px;
        }
        #qrCanvas { display: block; }
        .qr-url-disp { font-size: 0.7rem; color: var(--text-muted); word-break: break-all; margin-bottom: 14px; padding: 0 8px; }
        .dl-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn-dl {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 18px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border); border-radius: 100px;
            color: var(--text); font-family: 'Outfit', sans-serif;
            font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.3s;
            text-decoration: none;
        }
        .btn-dl:hover { background: rgba(129,140,248,0.15); border-color: rgba(129,140,248,0.3); }
        .btn-dl.primary { background: linear-gradient(135deg, #818cf8, #a78bfa); color: var(--bg); border-color: transparent; }
        .btn-dl.primary:hover { box-shadow: 0 4px 16px rgba(129,140,248,0.3); }
        .placeholder-msg { color: var(--text-muted); font-size: 0.82rem; padding: 40px 0; }

        .footer { text-align: center; margin-top: 32px; }
        .footer a { color: var(--text-muted); font-size: 0.82rem; text-decoration: none; transition: color 0.3s; }
        .footer a:hover { color: var(--accent); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        ::selection { background: rgba(129,140,248,0.3); color: var(--text); }

        /* Scrollable settings on mobile */
        .settings-scroll { max-height: none; overflow-y: visible; }
        @media (max-width: 768px) {
            .preview-card { position: static; order: -1; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <div class="header">
            <h1>🔲 Tạo QR Code</h1>
            <p>Tạo mã QR đẹp với hình trái tim, ngôi sao, kim cương,...</p>
        </div>

        <div class="main-grid">
            <!-- Settings -->
            <div class="card settings-scroll">
                <!-- URL -->
                <div class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    URL trang web
                </div>
                <div class="form-group">
                    <input type="url" id="urlInput" value="https://dev-pmthang.github.io/QR-WEB/" placeholder="https://example.com">
                </div>

                <div class="separator"></div>

                <!-- DOT SHAPE -->
                <div class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                    </svg>
                    Hình dạng điểm (Dot Shape)
                </div>
                <div class="form-group">
                    <div class="shape-grid" id="dotGrid"></div>
                </div>

                <div class="separator"></div>

                <!-- CORNER SHAPE -->
                <div class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/>
                    </svg>
                    Hình dạng góc (Corner Shape)
                </div>
                <div class="form-group">
                    <div class="corner-grid" id="cornerGrid"></div>
                </div>

                <div class="separator"></div>

                <!-- COLOR -->
                <div class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 2a7 7 0 0 0 0 20 4 4 0 0 1 0-8 4 4 0 0 0 0-8z"/>
                    </svg>
                    Kiểu màu (Color Style)
                </div>
                <div class="form-group">
                    <div class="color-grid" id="colorGrid"></div>
                </div>

                <div class="separator"></div>

                <!-- BG -->
                <div class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                    </svg>
                    Nền QR
                </div>
                <div class="form-group">
                    <div class="bg-grid" id="bgGrid"></div>
                </div>

                <div class="separator"></div>
                <button class="btn-gen" onclick="generateQR()">✨ Tạo QR Code</button>
            </div>

            <!-- Preview -->
            <div class="card preview-card">
                <div class="card-title" style="justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    Xem trước
                </div>
                <div class="qr-wrap" id="qrWrap">
                    <canvas id="qrCanvas" width="260" height="260"></canvas>
                </div>
                <div class="qr-url-disp" id="urlDisp"></div>
                <div class="dl-btns" id="dlBtns" style="display:none;">
                    <button class="btn-dl primary" onclick="downloadPNG()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        PNG
                    </button>
                    <button class="btn-dl" onclick="downloadSVG()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        SVG
                    </button>
                </div>
            </div>
        </div>

        <div class="footer"><a href="index.html">← Xem trang Sao Băng ✨</a></div>
    </div>

    <!-- QR Generator library (raw matrix) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script>
    // ============================================================
    //  CONFIG
    // ============================================================
    const DOT_SHAPES = [
        { id: 'square',   name: 'Vuông',     icon: '■' },
        { id: 'circle',   name: 'Tròn',      icon: '●' },
        { id: 'rounded',  name: 'Bo tròn',   icon: '▢' },
        { id: 'diamond',  name: 'Kim cương',  icon: '◆' },
        { id: 'heart',    name: 'Trái tim',   icon: '♥' },
        { id: 'star',     name: 'Ngôi sao',   icon: '★' },
        { id: 'star4',    name: 'Sao 4 cánh', icon: '✦' },
        { id: 'hexagon',  name: 'Lục giác',   icon: '⬡' },
        { id: 'leaf',     name: 'Lá cây',     icon: '🍃' },
        { id: 'cross',    name: 'Chữ thập',   icon: '✚' },
        { id: 'flower',   name: 'Hoa',        icon: '✿' },
        { id: 'raindrop', name: 'Giọt nước',  icon: '💧' },
        { id: 'arrow',    name: 'Mũi tên',    icon: '▸' },
        { id: 'moon',     name: 'Trăng',      icon: '☽' },
        { id: 'triangle', name: 'Tam giác',   icon: '▲' },
    ];

    const CORNER_SHAPES = [
        { id: 'square',  name: 'Vuông' },
        { id: 'round',   name: 'Tròn' },
        { id: 'rounded', name: 'Bo tròn' },
        { id: 'dot',     name: 'Chấm' },
    ];

    const COLORS = [
        { id: 'dark',    name: 'Tối',       c1: '#1a1a3e', c2: '#1a1a3e' },
        { id: 'black',   name: 'Đen',       c1: '#000000', c2: '#000000' },
        { id: 'ocean',   name: 'Đại dương', c1: '#0077b6', c2: '#00b4d8' },
        { id: 'sunset',  name: 'Hoàng hôn', c1: '#e63946', c2: '#f4a261' },
        { id: 'forest',  name: 'Rừng xanh', c1: '#2d6a4f', c2: '#52b788' },
        { id: 'purple',  name: 'Tím',       c1: '#7209b7', c2: '#b5179e' },
        { id: 'gold',    name: 'Vàng kim',  c1: '#b8860b', c2: '#ffd700' },
        { id: 'neon',    name: 'Neon',       c1: '#00ff87', c2: '#60efff' },
        { id: 'rose',    name: 'Hồng',      c1: '#ff006e', c2: '#fb5607' },
        { id: 'sky',     name: 'Bầu trời',  c1: '#4361ee', c2: '#4cc9f0' },
    ];

    const BGS = [
        { id: 'white', name: 'Trắng', color: '#ffffff' },
        { id: 'light', name: 'Xám nhạt', color: '#f0f0f5' },
        { id: 'trans', name: 'Trong suốt', color: null },
    ];

    // ============================================================
    //  STATE
    // ============================================================
    let state = { dot: 'square', corner: 'square', color: 'dark', bg: 'white' };

    // ============================================================
    //  BUILD UI
    // ============================================================
    function buildUI() {
        // Dot shapes
        const dotGrid = document.getElementById('dotGrid');
        DOT_SHAPES.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = 'shape-item' + (i === 0 ? ' active' : '');
            div.dataset.value = s.id;
            div.onclick = () => selectGroup('dot', s.id, dotGrid, div);
            const cvs = document.createElement('canvas');
            cvs.width = 64; cvs.height = 64;
            drawShapePreview(cvs, s.id);
            div.appendChild(cvs);
            const lbl = document.createElement('div');
            lbl.className = 'sname'; lbl.textContent = s.name;
            div.appendChild(lbl);
            dotGrid.appendChild(div);
        });

        // Corner shapes
        const cornerGrid = document.getElementById('cornerGrid');
        CORNER_SHAPES.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = 'corner-item' + (i === 0 ? ' active' : '');
            div.dataset.value = s.id;
            div.onclick = () => selectGroup('corner', s.id, cornerGrid, div);
            const cvs = document.createElement('canvas');
            cvs.width = 60; cvs.height = 60;
            drawCornerPreview(cvs, s.id);
            div.appendChild(cvs);
            const lbl = document.createElement('div');
            lbl.className = 'sname'; lbl.textContent = s.name;
            div.appendChild(lbl);
            cornerGrid.appendChild(div);
        });

        // Colors
        const colorGrid = document.getElementById('colorGrid');
        COLORS.forEach((c, i) => {
            const div = document.createElement('div');
            div.className = 'color-item' + (i === 0 ? ' active' : '');
            div.dataset.value = c.id;
            div.onclick = () => selectGroup('color', c.id, colorGrid, div);
            const sw = document.createElement('div');
            sw.className = 'color-swatch';
            sw.style.background = c.c1 === c.c2 ? c.c1 : `linear-gradient(135deg, ${c.c1}, ${c.c2})`;
            div.appendChild(sw);
            const lbl = document.createElement('div');
            lbl.className = 'sname'; lbl.textContent = c.name;
            div.appendChild(lbl);
            colorGrid.appendChild(div);
        });

        // Backgrounds
        const bgGrid = document.getElementById('bgGrid');
        BGS.forEach((b, i) => {
            const div = document.createElement('div');
            div.className = 'bg-item' + (i === 0 ? ' active' : '');
            div.dataset.value = b.id;
            div.onclick = () => selectGroup('bg', b.id, bgGrid, div);
            const sw = document.createElement('div');
            sw.className = 'color-swatch';
            sw.style.background = b.color || "repeating-conic-gradient(#555 0% 25%, #777 0% 50%) 50%/12px 12px";
            if (b.id === 'white') sw.style.border = '1px solid rgba(255,255,255,0.2)';
            div.appendChild(sw);
            const lbl = document.createElement('div');
            lbl.className = 'sname'; lbl.textContent = b.name;
            div.appendChild(lbl);
            bgGrid.appendChild(div);
        });
    }

    function selectGroup(key, val, grid, el) {
        grid.querySelectorAll('.shape-item,.corner-item,.color-item,.bg-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        state[key] = val;
        generateQR();
    }

    // ============================================================
    //  SHAPE DRAWING FUNCTIONS
    // ============================================================
    function drawShape(ctx, shape, cx, cy, size) {
        const r = size / 2;
        ctx.beginPath();
        switch (shape) {
            case 'square':
                ctx.rect(cx - r, cy - r, size, size);
                break;
            case 'circle':
                ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
                break;
            case 'rounded':
                roundedRect(ctx, cx - r, cy - r, size, size, size * 0.25);
                break;
            case 'diamond':
                ctx.moveTo(cx, cy - r);
                ctx.lineTo(cx + r, cy);
                ctx.lineTo(cx, cy + r);
                ctx.lineTo(cx - r, cy);
                ctx.closePath();
                break;
            case 'heart':
                drawHeart(ctx, cx, cy, r);
                break;
            case 'star':
                drawStar(ctx, cx, cy, r, 5);
                break;
            case 'star4':
                drawStar(ctx, cx, cy, r, 4);
                break;
            case 'hexagon':
                drawPolygon(ctx, cx, cy, r * 0.95, 6);
                break;
            case 'leaf':
                drawLeaf(ctx, cx, cy, r);
                break;
            case 'cross':
                drawCross(ctx, cx, cy, r);
                break;
            case 'flower':
                drawFlower(ctx, cx, cy, r);
                break;
            case 'raindrop':
                drawRaindrop(ctx, cx, cy, r);
                break;
            case 'arrow':
                drawArrow(ctx, cx, cy, r);
                break;
            case 'moon':
                drawMoon(ctx, cx, cy, r);
                break;
            case 'triangle':
                drawPolygon(ctx, cx, cy, r, 3);
                break;
            default:
                ctx.rect(cx - r, cy - r, size, size);
        }
        ctx.fill();
    }

    function roundedRect(ctx, x, y, w, h, rad) {
        ctx.moveTo(x + rad, y);
        ctx.lineTo(x + w - rad, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
        ctx.lineTo(x + w, y + h - rad);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
        ctx.lineTo(x + rad, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
        ctx.lineTo(x, y + rad);
        ctx.quadraticCurveTo(x, y, x + rad, y);
        ctx.closePath();
    }

    function drawHeart(ctx, cx, cy, r) {
        const s = r * 0.9;
        ctx.moveTo(cx, cy + s * 0.7);
        ctx.bezierCurveTo(cx - s * 1.2, cy - s * 0.1, cx - s * 0.6, cy - s * 1.0, cx, cy - s * 0.4);
        ctx.bezierCurveTo(cx + s * 0.6, cy - s * 1.0, cx + s * 1.2, cy - s * 0.1, cx, cy + s * 0.7);
        ctx.closePath();
    }

    function drawStar(ctx, cx, cy, r, points) {
        const inner = r * 0.42;
        const outer = r * 0.9;
        const step = Math.PI / points;
        ctx.moveTo(cx, cy - outer);
        for (let i = 0; i < points * 2; i++) {
            const rad = i % 2 === 0 ? outer : inner;
            const angle = -Math.PI / 2 + step * i;
            ctx.lineTo(cx + Math.cos(angle) * rad, cy + Math.sin(angle) * rad);
        }
        ctx.closePath();
    }

    function drawPolygon(ctx, cx, cy, r, sides) {
        for (let i = 0; i < sides; i++) {
            const angle = -Math.PI / 2 + (2 * Math.PI / sides) * i;
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.closePath();
    }

    function drawLeaf(ctx, cx, cy, r) {
        const s = r * 0.9;
        ctx.moveTo(cx, cy - s);
        ctx.quadraticCurveTo(cx + s * 1.1, cy - s * 0.3, cx, cy + s);
        ctx.quadraticCurveTo(cx - s * 1.1, cy - s * 0.3, cx, cy - s);
        ctx.closePath();
    }

    function drawCross(ctx, cx, cy, r) {
        const w = r * 0.35;
        ctx.moveTo(cx - w, cy - r);
        ctx.lineTo(cx + w, cy - r);
        ctx.lineTo(cx + w, cy - w);
        ctx.lineTo(cx + r, cy - w);
        ctx.lineTo(cx + r, cy + w);
        ctx.lineTo(cx + w, cy + w);
        ctx.lineTo(cx + w, cy + r);
        ctx.lineTo(cx - w, cy + r);
        ctx.lineTo(cx - w, cy + w);
        ctx.lineTo(cx - r, cy + w);
        ctx.lineTo(cx - r, cy - w);
        ctx.lineTo(cx - w, cy - w);
        ctx.closePath();
    }

    function drawFlower(ctx, cx, cy, r) {
        const petals = 5;
        const pr = r * 0.55;
        for (let i = 0; i < petals; i++) {
            const angle = (2 * Math.PI / petals) * i - Math.PI / 2;
            const px = cx + Math.cos(angle) * pr * 0.6;
            const py = cy + Math.sin(angle) * pr * 0.6;
            ctx.moveTo(px + pr * 0.5, py);
            ctx.arc(px, py, pr * 0.5, 0, Math.PI * 2);
        }
        ctx.moveTo(cx + r * 0.25, cy);
        ctx.arc(cx, cy, r * 0.25, 0, Math.PI * 2);
    }

    function drawRaindrop(ctx, cx, cy, r) {
        const s = r * 0.85;
        ctx.moveTo(cx, cy - s);
        ctx.bezierCurveTo(cx + s * 0.7, cy - s * 0.2, cx + s * 0.7, cy + s * 0.5, cx, cy + s);
        ctx.bezierCurveTo(cx - s * 0.7, cy + s * 0.5, cx - s * 0.7, cy - s * 0.2, cx, cy - s);
        ctx.closePath();
    }

    function drawArrow(ctx, cx, cy, r) {
        const s = r * 0.85;
        ctx.moveTo(cx + s, cy);
        ctx.lineTo(cx, cy - s);
        ctx.lineTo(cx, cy - s * 0.35);
        ctx.lineTo(cx - s, cy - s * 0.35);
        ctx.lineTo(cx - s, cy + s * 0.35);
        ctx.lineTo(cx, cy + s * 0.35);
        ctx.lineTo(cx, cy + s);
        ctx.closePath();
    }

    function drawMoon(ctx, cx, cy, r) {
        const s = r * 0.9;
        ctx.arc(cx, cy, s, 0, Math.PI * 2);
        ctx.moveTo(cx + s * 0.5 + s * 0.7, cy);
        ctx.arc(cx + s * 0.5, cy, s * 0.7, 0, Math.PI * 2, true);
    }

    // ============================================================
    //  PREVIEW THUMBNAILS
    // ============================================================
    function drawShapePreview(canvas, shapeId) {
        const ctx = canvas.getContext('2d');
        const s = canvas.width;
        ctx.clearRect(0, 0, s, s);
        ctx.fillStyle = '#818cf8';
        const grid = 3;
        const gap = 2;
        const cellSize = (s - gap * (grid + 1)) / grid;
        for (let r = 0; r < grid; r++) {
            for (let c = 0; c < grid; c++) {
                const cx = gap + c * (cellSize + gap) + cellSize / 2;
                const cy = gap + r * (cellSize + gap) + cellSize / 2;
                drawShape(ctx, shapeId, cx, cy, cellSize * 0.85);
            }
        }
    }

    function drawCornerPreview(canvas, cornerId) {
        const ctx = canvas.getContext('2d');
        const s = canvas.width;
        ctx.clearRect(0, 0, s, s);
        ctx.fillStyle = '#818cf8';
        ctx.strokeStyle = '#818cf8';
        ctx.lineWidth = 3;
        const m = 6;
        const sz = s - m * 2;
        switch (cornerId) {
            case 'square':
                ctx.strokeRect(m, m, sz, sz);
                ctx.fillRect(m + sz * 0.25, m + sz * 0.25, sz * 0.5, sz * 0.5);
                break;
            case 'round':
                ctx.beginPath();
                roundedRect(ctx, m, m, sz, sz, sz * 0.25);
                ctx.stroke();
                ctx.beginPath();
                roundedRect(ctx, m + sz * 0.25, m + sz * 0.25, sz * 0.5, sz * 0.5, sz * 0.12);
                ctx.fill();
                break;
            case 'rounded':
                ctx.beginPath();
                roundedRect(ctx, m, m, sz, sz, sz * 0.4);
                ctx.stroke();
                ctx.beginPath();
                roundedRect(ctx, m + sz * 0.25, m + sz * 0.25, sz * 0.5, sz * 0.5, sz * 0.2);
                ctx.fill();
                break;
            case 'dot':
                ctx.beginPath(); ctx.arc(s / 2, s / 2, sz / 2, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(s / 2, s / 2, sz * 0.22, 0, Math.PI * 2); ctx.fill();
                break;
        }
    }

    // ============================================================
    //  QR GENERATION
    // ============================================================
    function generateQR() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) return;

        // Generate QR data matrix
        const qr = qrcode(0, 'H');
        qr.addData(url);
        qr.make();

        const moduleCount = qr.getModuleCount();
        const canvas = document.getElementById('qrCanvas');
        const margin = 16;
        const cellSize = Math.floor((260 - margin * 2) / moduleCount);
        const totalSize = cellSize * moduleCount + margin * 2;
        canvas.width = totalSize;
        canvas.height = totalSize;

        const ctx = canvas.getContext('2d');

        // Background
        const bgConf = BGS.find(b => b.id === state.bg);
        if (bgConf && bgConf.color) {
            ctx.fillStyle = bgConf.color;
            ctx.fillRect(0, 0, totalSize, totalSize);
        } else {
            ctx.clearRect(0, 0, totalSize, totalSize);
        }

        // Color
        const colorConf = COLORS.find(c => c.id === state.color);
        let fillStyle;
        if (colorConf.c1 === colorConf.c2) {
            fillStyle = colorConf.c1;
        } else {
            const grad = ctx.createLinearGradient(0, 0, totalSize, totalSize);
            grad.addColorStop(0, colorConf.c1);
            grad.addColorStop(1, colorConf.c2);
            fillStyle = grad;
        }

        // Finder pattern positions (top-left, top-right, bottom-left)
        const finderPositions = [
            { r: 0, c: 0 },
            { r: 0, c: moduleCount - 7 },
            { r: moduleCount - 7, c: 0 }
        ];

        function isInFinderRegion(row, col) {
            for (const fp of finderPositions) {
                if (row >= fp.r && row < fp.r + 7 && col >= fp.c && col < fp.c + 7) return true;
            }
            return false;
        }

        // Draw data dots (non-finder modules)
        ctx.fillStyle = fillStyle;
        for (let r = 0; r < moduleCount; r++) {
            for (let c = 0; c < moduleCount; c++) {
                if (qr.isDark(r, c) && !isInFinderRegion(r, c)) {
                    const cx = margin + c * cellSize + cellSize / 2;
                    const cy = margin + r * cellSize + cellSize / 2;
                    drawShape(ctx, state.dot, cx, cy, cellSize * 0.92);
                }
            }
        }

        // Draw finder patterns
        ctx.fillStyle = fillStyle;
        finderPositions.forEach(fp => {
            drawFinderPattern(ctx, margin + fp.c * cellSize, margin + fp.r * cellSize, cellSize * 7, state.corner, fillStyle, bgConf);
        });

        // UI updates
        document.getElementById('urlDisp').textContent = url;
        document.getElementById('dlBtns').style.display = 'flex';
        const wrap = document.getElementById('qrWrap');
        wrap.className = 'qr-wrap' + (state.bg === 'trans' ? ' checker' : '');
    }

    function drawFinderPattern(ctx, x, y, size, cornerStyle, fillStyle, bgConf) {
        const bgColor = bgConf && bgConf.color ? bgConf.color : '#ffffff';
        ctx.save();
        ctx.fillStyle = fillStyle;

        switch (cornerStyle) {
            case 'square':
                ctx.fillRect(x, y, size, size);
                ctx.fillStyle = bgColor;
                ctx.fillRect(x + size / 7, y + size / 7, size * 5 / 7, size * 5 / 7);
                ctx.fillStyle = fillStyle;
                ctx.fillRect(x + size * 2 / 7, y + size * 2 / 7, size * 3 / 7, size * 3 / 7);
                break;
            case 'round':
                const rad1 = size * 0.18;
                const rad2 = size * 0.12;
                const rad3 = size * 0.08;
                ctx.beginPath(); roundedRect(ctx, x, y, size, size, rad1); ctx.fill();
                ctx.fillStyle = bgColor;
                ctx.beginPath(); roundedRect(ctx, x + size / 7, y + size / 7, size * 5 / 7, size * 5 / 7, rad2); ctx.fill();
                ctx.fillStyle = fillStyle;
                ctx.beginPath(); roundedRect(ctx, x + size * 2 / 7, y + size * 2 / 7, size * 3 / 7, size * 3 / 7, rad3); ctx.fill();
                break;
            case 'rounded':
                const rr1 = size * 0.3;
                const rr2 = size * 0.2;
                const rr3 = size * 0.12;
                ctx.beginPath(); roundedRect(ctx, x, y, size, size, rr1); ctx.fill();
                ctx.fillStyle = bgColor;
                ctx.beginPath(); roundedRect(ctx, x + size / 7, y + size / 7, size * 5 / 7, size * 5 / 7, rr2); ctx.fill();
                ctx.fillStyle = fillStyle;
                ctx.beginPath(); roundedRect(ctx, x + size * 2 / 7, y + size * 2 / 7, size * 3 / 7, size * 3 / 7, rr3); ctx.fill();
                break;
            case 'dot':
                const cx = x + size / 2, cy = y + size / 2;
                ctx.beginPath(); ctx.arc(cx, cy, size / 2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = bgColor;
                ctx.beginPath(); ctx.arc(cx, cy, size * 5 / 14, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = fillStyle;
                ctx.beginPath(); ctx.arc(cx, cy, size * 3 / 14, 0, Math.PI * 2); ctx.fill();
                break;
        }
        ctx.restore();
    }

    // ============================================================
    //  DOWNLOAD
    // ============================================================
    function downloadPNG() {
        const canvas = document.getElementById('qrCanvas');
        // Create high-res version
        const hiRes = document.createElement('canvas');
        const scale = 4;
        hiRes.width = canvas.width * scale;
        hiRes.height = canvas.height * scale;
        const ctx = hiRes.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.scale(scale, scale);

        // Re-render at high res
        const bgConf = BGS.find(b => b.id === state.bg);
        if (bgConf && bgConf.color) {
            ctx.fillStyle = bgConf.color;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Copy from visible canvas
        ctx.drawImage(canvas, 0, 0);

        const link = document.createElement('a');
        link.download = 'qr-code.png';
        link.href = hiRes.toDataURL('image/png');
        link.click();
    }

    function downloadSVG() {
        const canvas = document.getElementById('qrCanvas');
        // Simple SVG export from canvas
        const dataUrl = canvas.toDataURL('image/png');
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${canvas.width}" height="${canvas.height}">
            <image href="${dataUrl}" width="${canvas.width}" height="${canvas.height}"/>
        </svg>`;
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const link = document.createElement('a');
        link.download = 'qr-code.svg';
        link.href = URL.createObjectURL(blob);
        link.click();
        URL.revokeObjectURL(link.href);
    }

    // ============================================================
    //  INIT
    // ============================================================
    buildUI();
    window.addEventListener('DOMContentLoaded', () => setTimeout(generateQR, 200));

    let urlTimeout;
    document.getElementById('urlInput').addEventListener('input', () => {
        clearTimeout(urlTimeout);
        urlTimeout = setTimeout(() => {
            if (document.getElementById('urlInput').value.trim()) generateQR();
        }, 500);
    });
    </script>
</body>
